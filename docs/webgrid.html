<!doctype html>
<meta charset="utf-8">
<title>HeadClick target test</title>
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,system-ui,sans-serif;background:#f4f5f7;color:#111;overflow:hidden}
  #bar{position:fixed;top:0;left:0;right:0;padding:10px 16px;display:flex;gap:14px;align-items:center;background:#fff;border-bottom:1px solid #ddd;z-index:5}
  #stage{position:absolute;inset:52px 0 0 0}
  .t{position:absolute;width:56px;height:56px;border-radius:50%;background:#e5484d;border:4px solid #fff;box-shadow:0 0 0 2px #e5484d;transform:translate(-50%,-50%);cursor:pointer}
  button,select{font-size:15px;padding:6px 12px}
  #log{position:fixed;right:16px;bottom:16px;background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px 14px;font-size:13px;max-width:380px}
  td{padding:2px 10px}
</style>
<div id="bar">
  <b>HeadClick target test</b>
  <label>Mode <select id="mode"><option>head only</option><option>head + gaze jump</option><option>gaze only</option><option>trackpad (baseline)</option></select></label>
  <button id="start">Start (20 targets)</button>
  <span id="status">Click Start, then click each red dot as fast as you can.</span>
</div>
<div id="stage"></div>
<div id="log"><b>Results</b><table id="res"></table></div>
<script>
const N=20, stage=document.getElementById('stage'), st=document.getElementById('status');
let n=0, t0=0, tt=0, errors=0, running=false, seed=1;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function pos(){const m=60,w=stage.clientWidth,h=stage.clientHeight;return [m+rnd()*(w-2*m),m+rnd()*(h-2*m)]}
function showTarget(){stage.innerHTML='';const [x,y]=pos();const d=document.createElement('div');d.className='t';d.style.left=x+'px';d.style.top=y+'px';
  d.onclick=e=>{e.stopPropagation();n++;if(n>=N)finish();else{st.textContent=`${n}/${N}`;showTarget()}};stage.appendChild(d)}
stage.onclick=()=>{if(running)errors++};
document.getElementById('start').onclick=()=>{seed=12345;n=0;errors=0;running=true;t0=performance.now();st.textContent=`0/${N}`;showTarget()};
function finish(){running=false;stage.innerHTML='';const s=(performance.now()-t0)/1000;
  const row={mode:document.getElementById('mode').value,total:s.toFixed(1),per:(s/N).toFixed(2),miss:errors};
  const all=JSON.parse(localStorage.getItem('hc-results')||'[]');all.push(row);localStorage.setItem('hc-results',JSON.stringify(all));
  st.textContent=`Done: ${row.total} s, ${row.per} s per target, ${row.miss} missed clicks.`;render()}
function render(){const all=JSON.parse(localStorage.getItem('hc-results')||'[]');
  document.getElementById('res').innerHTML='<tr><td>mode</td><td>total s</td><td>s/target</td><td>misses</td></tr>'+all.slice(-8).map(r=>`<tr><td>${r.mode}</td><td>${r.total}</td><td>${r.per}</td><td>${r.miss}</td></tr>`).join('')}
render();
</script>
